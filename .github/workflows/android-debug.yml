name: Android debug build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Check 1 - Unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Check 2 - Android lint
        run: bash ./gradlew :app:lintDebug --stacktrace
      - name: Check 3 - Build APKs
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MutinyMedia-Android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

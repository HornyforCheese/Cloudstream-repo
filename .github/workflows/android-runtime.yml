name: Android runtime tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-runtime.yml'
      - '.github/scripts/run-device-tests.sh'
      - 'app/**'
      - 'test-fixtures/**'
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build app, device tests and game fixture
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          ./gradlew -p test-fixtures/game-app assembleDebug --stacktrace
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Run Android 11 device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-runtime-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            runtime-screenshots/
            device-logcat.txt
          if-no-files-found: warn
